name: Build Docker images

# Manual escape hatch. Releases publish their image from make-release.yml;
# this rebuilds one from the binaries a published release already carries,
# for instance after a base image fix, without cutting a new release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose binaries go into the image (11.0.0 or later)
        required: true
      latest:
        description: Also move the :latest tag to this image
        type: boolean
        default: true

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN || secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --dir artifacts \
            --pattern findomain-linux.zip --pattern findomain-aarch64-musl.zip
          unzip -q artifacts/findomain-linux.zip        -d artifacts/amd64
          unzip -q artifacts/findomain-aarch64-musl.zip -d artifacts/arm64
          install -D -m 755 artifacts/amd64/findomain docker/bin/amd64/findomain
          install -D -m 755 artifacts/arm64/findomain docker/bin/arm64/findomain

      - name: Decide the tags
        id: tags
        run: |
          tags="${DOCKERHUB_USER}/findomain:${{ inputs.tag }}"
          if [ "${{ inputs.latest }}" = "true" ]; then
            tags="${tags},${DOCKERHUB_USER}/findomain:latest"
          fi
          echo "list=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
